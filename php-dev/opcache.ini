; Konfigurasi OPcache khusus proyek (dimuat via PHP_INI_SCAN_DIR).
; Tidak mengubah php.ini global Laragon — aktif hanya saat proses dijalankan
; dengan variabel lingkungan PHP_INI_SCAN_DIR yang mengarah ke folder ini.
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
